[project]
name = "agentops"
version = "0.1.0"
description = "Mini Agentic AI Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langgraph>=1.2.12",
    "networkx>=3.7",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "rich>=15.0.0",
    "ruff>=0.16.8",
    "sqlalchemy>=2.0.54",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
agentops = "agentops.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/contract",
    "tests/evaluation"
]
